worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ACME HTTP-01 验证兜底 (webroot 模式, 无需 DNS API)
    # 未匹配任何 server_name 的域名在 80 端口:
    #   /.well-known/acme-challenge/* → 从 /var/www/html 直接响应 (证书验证)
    #   其他路径 → 301 跳转 https
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    include /etc/nginx/conf.d/[^s]*.conf;
    include /etc/nginx/conf.d/s[^t]*.conf;
    include /etc/nginx/conf.d/st[^r]*.conf;
    include /etc/nginx/conf.d/str[^e]*.conf;
    include /etc/nginx/conf.d/stre[^a]*.conf;
    include /etc/nginx/conf.d/strea[^m]*.conf;
    include /etc/nginx/conf.d/stream?.+.conf;
}

# stream 模块 — entrypoint.sh 会检查是否支持 stream
# 如果 nginx 不支持 stream 指令, entrypoint 会移除此块
stream {
    include /etc/nginx/conf.d/stream_*.conf;
}
