services:
  nginx-manager:
    image: ywsj/nginx-manager:latest
    container_name: nginx-manager
    ports:
      - "80:80"
      - "443:443"
      - "5400:5000"
    volumes:
      - ./data:/data
      - ./conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - ./logs:/var/log/nginx
      - ./acme.sh:/home/appuser/.acme.sh
    environment:
      - SECRET_KEY=change-me-to-random-string
    restart: always
