<!DOCTYPE html>
<html lang="{{ current_language() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('setup.title') }} — {{ t('app.title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-theme-toggle {
            position: fixed; top: 20px; right: 20px;
            width: 42px; height: 42px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--card);
            color: var(--muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: var(--transition); z-index: 100;
        }
        .auth-theme-toggle:hover {
            border-color: var(--accent); color: var(--accent);
            transform: rotate(180deg);
        }
        .auth-bg-deco {
            position: fixed; border-radius: 50%; filter: blur(80px);
            opacity: 0.15; z-index: -1; pointer-events: none;
        }
        .auth-bg-deco-1 { width: 300px; height: 300px; background: var(--accent); top: -50px; right: -50px; }
        .auth-bg-deco-2 { width: 250px; height: 250px; background: var(--info); bottom: -60px; left: -60px; }
    </style>
</head>
<body class="auth-body">
    <div class="auth-bg-deco auth-bg-deco-1"></div>
    <div class="auth-bg-deco auth-bg-deco-2"></div>
    <button class="auth-theme-toggle" onclick="toggleAuthTheme()" title="明暗切换">
        <i class="fas fa-moon" id="auth-theme-icon"></i>
    </button>
    <div class="auth-container">
        {% if done %}
        <div class="auth-card">
            <div class="auth-logo"><i class="fas fa-cube" style="color: var(--accent)"></i></div>
            <div class="alert alert-success" style="text-align:center">
                <i class="fas fa-check-circle" style="font-size:2rem;margin-bottom:0.5rem"></i>
                <p>{{ t('setup.done') }}</p>
            </div>
            <script>setTimeout(() => location.href = '/login', 2000);</script>
        </div>
        {% else %}
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-cube"></i>
                <h1>nginx<span class="logo-accent">manager</span></h1>
            </div>
            <h2>{{ t('setup.title') }}</h2>
            <p class="text-muted text-center">{{ t('setup.subtitle') }}</p>
            {% if error_key %}
            <div class="alert alert-error">{{ t(error_key) }}</div>
            {% endif %}
            <form method="POST" action="/setup" class="auth-form">
                <div class="form-group">
                    <label>{{ t('setup.username') }}</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" class="form-input" required minlength="2" autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label>{{ t('setup.password') }}</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" class="form-input" required minlength="6">
                    </div>
                </div>
                <div class="form-group">
                    <label>{{ t('setup.confirm') }}</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="confirm" class="form-input" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">{{ t('setup.submit') }}</button>
            </form>
            <div class="auth-footer">
                <div class="lang-switcher lang-center">
                    {% for code, name in supported_languages().items() %}
                    <button class="lang-btn {% if code == current_language() %}active{% endif %}"
                            onclick="switchLanguage('{{ code }}')">{{ name }}</button>
                    {% endfor %}
                </div>
            </div>
        </div>
        {% endif %}
    </div>
    <script>
        window.I18N_LANG = '{{ current_language() }}';
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.body.classList.add('light');
                const icon = document.getElementById('auth-theme-icon');
                if (icon) icon.className = 'fas fa-sun';
            }
        })();
        function toggleAuthTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('auth-theme-icon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        }
        function switchLanguage(lang) {
            fetch('/api/language', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({language: lang})
            }).then(() => location.reload());
        }
    </script>
</body>
</html>
